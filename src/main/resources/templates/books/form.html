<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{book.new}">New book</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="header-nav">
        <h1 th:text="#{book.new}">New book</h1>
        <div class="lang-switch">
            <span>Language: </span>
            <a th:href="@{/books/new(lang='en')}">English</a> |
            <a th:href="@{/books/new(lang='ru')}">Русский</a>
        </div>
    </div>

    <form th:action="@{/books}" th:object="${form}" method="post">

        <!-- Summary of all errors -->
        <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
            <p><strong>Errors detected:</strong></p>
            <ul>
                <li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li>
            </ul>
        </div>

        <!-- Variant 2: Global errors from class-level constraint -->
        <div class="alert alert-warning" th:if="${#fields.hasGlobalErrors()}">
            <p><strong>Validation constraint:</strong></p>
            <ul>
                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
            </ul>
        </div>

        <div class="form-group">
            <label th:text="#{book.title}">Title</label>
            <input type="text" th:field="*{title}" th:errorclass="is-invalid" placeholder="e.g. Effective Java">
            <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </div>

        <div class="form-group">
            <label th:text="#{book.author}">Author</label>
            <input type="text" th:field="*{author}" th:errorclass="is-invalid" placeholder="e.g. Joshua Bloch">
            <span class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span>
        </div>

        <div class="form-group">
            <label th:text="#{book.year}">Year</label>
            <input type="number" th:field="*{year}" th:errorclass="is-invalid" placeholder="e.g. 2018">
            <span class="error" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></span>
        </div>

        <!-- Variant 2: Reprint year field -->
        <div class="form-group">
            <label>
                <span th:text="#{book.reprintYear}">Reprint year</span>
                <small class="muted" th:text="#{books.reprintYearNote}">(Variant 2: Class-level constraint)</small>
            </label>
            <input type="number" th:field="*{reprintYear}" th:errorclass="is-invalid" placeholder="e.g. 2024">
            <span class="error" th:if="${#fields.hasErrors('reprintYear')}" th:errors="*{reprintYear}"></span>
        </div>

        <div class="form-group">
            <label th:text="#{book.genre}">Genre</label>
            <select th:field="*{genre}" th:errorclass="is-invalid">
                <option value="">--</option>
                <option th:each="g : ${genres}"
                        th:value="${g}" th:text="${g}"></option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}"></span>
        </div>

        <div class="form-group checkbox-group">
            <label><input type="checkbox" th:field="*{available}"> <span th:text="#{book.available}">Available</span></label>
        </div>

        <div class="form-actions">
            <button type="submit" th:text="#{form.submit}">Save</button>
            <a th:href="@{/books}" class="btn-secondary" th:text="#{books.backToList}">Back to catalogue</a>
        </div>
    </form>
</body>
</html>
